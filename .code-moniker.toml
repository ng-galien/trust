default_rules = false

# Project-wide design contracts live here; owner-local parser/completion wiring
# lives in the operation, procedure and language-server fragments. Curation and
# evidence boundaries: docs/architecture/rule-curation.md. IDs express durable
# dependency or call-flow decisions, not a list of symptoms from one incident.

[rules.taxonomy]
patterns = ["dependency", "call-flow"]
components = ["gherkin", "operation", "procedure", "language-server", "runtime", "ui", "editor", "authority", "extension-host", "extension-sdk", "coordination", "coordination-ui", "dragon-heist", "dragon-heist-ui"]

# Cross-package imports use the npm specifier (`@trust/...`) and are indexed as
# `external_pkg:` monikers, never as workspace `dir:` paths. Every *_target alias
# therefore matches both forms; a rule written against `dir:` alone is vacuous
# (ng-galien/code-moniker#20 tracks exact matching of scoped package names).
[aliases]
gherkin_source = "source ~ '**/dir:packages/dir:trust-gherkin/**'"
operation_source = "source ~ '**/dir:packages/dir:trust-operation/**'"
procedure_source = "source ~ '**/dir:packages/dir:trust-procedure/**'"
authority_source = "$gherkin_source OR $operation_source OR $procedure_source"
authority_contract_facade = "source ~ '**/dir:packages/dir:/^(trust-operation|trust-procedure|trust-extension-sdk)$/dir:src/module:index'"
authority_contract_target = "$operation_target OR $procedure_target OR target ~ '**/dir:packages/dir:trust-extension-sdk/**' OR target ~ '**/external_pkg:/@trust.extension-sdk/**'"
authority_matcher_target = "(target ~ '**/external_pkg:/@trust.operation/**' OR target ~ '**/external_pkg:/@trust.procedure/**' OR target ~ '**/external_pkg:/@trust.extension-sdk/**') AND target ~ '**/path:/^match[A-Z]/'"
authority_matcher_subpath = "target ~ '**/path:match/path:/^match[A-Z]/'"
# Deliberately bounded semantic consumers, not protocol routing, parsers, or the
# canonical match implementations. Add new total-dispatch consumer modules here.
authority_dispatch_import = "kind = 'imports_symbol' AND (target ~ '**/external_pkg:/@trust.operation/**/path:/^(OperationStep|ShellStep|HttpStep|FileReadStep|PostgresqlStep|Shell|Http|FileRead|Postgresql|ShellArgument|HttpValueSource|HttpPathSegment|HttpBody|FileFormat|HttpFormat|matchOperationStep|matchShellArgument|matchHttpValueSource|matchHttpPathSegment|matchHttpBody|matchHttpFormat|matchFileFormat)$/' OR target ~ '**/external_pkg:/@trust.procedure/**/path:/^(CompiledProcedureRole|CompiledExpressionReference|matchProcedureRoleSource|matchProcedureRoleCardinality|matchExpressionReference|isPlanInputRoleSource)$/' OR target ~ '**/external_pkg:/@trust.extension-sdk/**/path:/^(MissionDefinition|matchMissionDefinition)$/' )"
# This exact JSON boundary constructs MissionDefinition from unknown input; it
# does not dispatch accepted definitions. Semantic mission consumers stay guarded.
mission_json_boundary = "moniker ~ '**/dir:packages/dir:trust-runtime/dir:src/dir:plan/module:mission-declarations'"
authority_role_source_import = "kind = 'imports_symbol' AND target ~ '**/external_pkg:/@trust.procedure/**/path:/^(CompiledProcedureRole|matchProcedureRoleSource|isPlanInputRoleSource)$/'"
authority_role_source_consumer = "$authority_dispatch_consumer AND any(out_refs, $authority_role_source_import)"
authority_dispatch_consumer = "moniker ~ '**/dir:packages/dir:trust-runner/dir:src/dir:/^(operation|http|file-read)$/module:run' OR moniker ~ '**/dir:packages/dir:trust-ui/dir:src/dir:resources/dir:operations/module:/^(overview-view|contract-view|simulation-view|http-view-model|classification)$/' OR moniker ~ '**/dir:packages/dir:trust-ui/dir:src/dir:resources/dir:procedures/module:dependencies' OR ((NOT ($mission_json_boundary OR moniker ~ '**/dir:packages/dir:trust-operation/**' OR moniker ~ '**/dir:packages/dir:trust-procedure/**' OR moniker ~ '**/dir:acceptance/**')) AND any(out_refs, $authority_dispatch_import))"
language_server_source = "source ~ '**/dir:packages/dir:trust-language-server/**'"
runtime_source = "source ~ '**/dir:packages/dir:trust-runtime/**'"
extension_sdk_source = "source ~ '**/dir:packages/dir:trust-extension-sdk/**'"
ui_source = "source ~ '**/dir:packages/dir:trust-ui/**' OR source ~ '**/dir:apps/dir:trust-web/**'"
ui_docs_highlight_source = "source ~ '**/dir:docs/module:highlight/**' OR source ~ '**/dir:docs/module:highlight'"
editor_source = "source ~ '**/dir:packages/dir:trust-ui/dir:src/dir:resources/dir:templates/**' OR source ~ '**/module:gherkin-editor/**' OR source ~ '**/module:gherkin-editor' OR source ~ '**/module:lsp-client/**' OR source ~ '**/module:lsp-client' OR source ~ '**/module:monaco-stack/**' OR source ~ '**/module:monaco-stack' OR source ~ '**/module:editor-resource-navigation/**' OR source ~ '**/module:editor-resource-navigation'"

gherkin_target = "target ~ '**/dir:packages/dir:trust-gherkin/**' OR target ~ '**/external_pkg:/@trust.gherkin/**'"
operation_target = "target ~ '**/dir:packages/dir:trust-operation/**' OR target ~ '**/external_pkg:/@trust.operation/**'"
procedure_target = "target ~ '**/dir:packages/dir:trust-procedure/**' OR target ~ '**/external_pkg:/@trust.procedure/**'"
language_server_target = "target ~ '**/dir:packages/dir:trust-language-server/**' OR target ~ '**/external_pkg:/@trust.language-server/**'"
runtime_target = "target ~ '**/dir:packages/dir:trust-runtime/**' OR target ~ '**/external_pkg:/@trust.runtime/**'"
ui_target = "target ~ '**/dir:packages/dir:trust-ui/**' OR target ~ '**/external_pkg:/@trust.ui/**'"
authority_target = "$gherkin_target OR $operation_target OR $procedure_target"
gherkin_downstream_target = "$operation_target OR $procedure_target OR $language_server_target OR $runtime_target OR $ui_target"
operation_downstream_target = "$procedure_target OR $language_server_target OR $runtime_target OR $ui_target"
procedure_downstream_target = "$language_server_target OR $runtime_target OR $ui_target"
authority_language_behavior_target = "target ~ '**/external_pkg:/@trust./*:/^(materializeTemplate|validateTemplateDefinition|validateTemplateParameters|procedureScopeFragment|analyzeProcedureScopeFragment|scanTemplatePlaceholders|isTemplateParameterName|parseGherkin|tokenizeSentence|highlightGherkinSource|highlightExpressionSource|formatGherkinSource|analyzeOperation|analyzeProcedure|analyzeProcedureScope|isExpressionIdentifierPart|isExpressionIdentifierStart|qualificationCompletionPath|expressionMember|SentenceCursor|matchStepGrammar|parseStepGrammar|parseStepGrammarPrefix|stepChoice|stepGrammarExpectations|stepGrammarFailure|stepLiteral|stepOneOf|stepOptional|stepQuoted|stepRepeat|stepSequence|operationStepGrammar|procedureStepGrammar)$/'"

gherkin_parse_step_grammar_target = "target ~ '**/external_pkg:/@trust.gherkin/function:parseStepGrammar'"

# These components describe responsibilities: coordination-ui is the browser
# part of coordination, while extension-host spans runtime and UI adapters.
extension_host_source = "source ~ '**/dir:packages/dir:trust-runtime/dir:src/dir:extensions/**' OR source ~ '**/dir:packages/dir:trust-runtime/dir:src/dir:http/module:extensions/**' OR source ~ '**/dir:packages/dir:trust-runtime/dir:src/dir:http/module:extensions' OR source ~ '**/dir:packages/dir:trust-ui/dir:src/dir:extensions/**'"
coordination_source = "source ~ '**/dir:extensions/dir:coordination/module:/^(server|commands)$/**' OR source ~ '**/dir:extensions/dir:coordination/module:/^(server|commands)$/' OR $coordination_ui_source"
coordination_ui_source = "source ~ '**/dir:extensions/dir:coordination/dir:ui/**'"
coordination_target = "target ~ '**/dir:extensions/dir:coordination/**' OR target ~ '**/external_pkg:/@trust-extension.coordination/**'"
coordination_server_target = "target ~ '**/dir:extensions/dir:coordination/module:/^(server|commands)$/**' OR target ~ '**/dir:extensions/dir:coordination/module:/^(server|commands)$/' OR target ~ '**/external_pkg:/@trust-extension.coordination/path:/^(server|commands)$/**' OR target ~ '**/external_pkg:/@trust-extension.coordination/path:/^(server|commands)$/'"
coordination_ui_server_api_target = "target ~ '**/external_pkg:pg/**' OR target ~ '**/sdk:ts/path:/^node:/**'"
dragon_heist_source = "source ~ '**/dir:extensions/dir:dragon-heist/module:/^(server|game|store|commands)$/**' OR source ~ '**/dir:extensions/dir:dragon-heist/module:/^(server|game|store|commands)$/' OR $dragon_heist_ui_source"
dragon_heist_ui_source = "source ~ '**/dir:extensions/dir:dragon-heist/dir:ui/**'"
dragon_heist_target = "target ~ '**/dir:extensions/dir:dragon-heist/**' OR target ~ '**/external_pkg:/@trust-extension.dragon-heist/**'"
dragon_heist_server_target = "target ~ '**/dir:extensions/dir:dragon-heist/module:/^(server|game|store|commands)$/**' OR target ~ '**/dir:extensions/dir:dragon-heist/module:/^(server|game|store|commands)$/' OR target ~ '**/sdk:ts/path:/^node:/**'"

[profiles.extension-boundaries]
enable = [
  "^refs\\.extension-host-dependency-excludes-coordination$",
  "^refs\\.coordination-dependency-excludes-runtime-and-ui-implementation$",
  "^refs\\.coordination-ui-dependency-excludes-server-implementation$",
]

[profiles.canonical-contracts]
enable = [
  "^refs\\.authority-dependency-excludes-consumer-contract-relays$",
  "^refs\\.authority-dependency-uses-matcher-subpath$",
  "^refs\\.extension-sdk-dependency-excludes-runtime-implementation$",
  "^ts\\.interface\\.ui-dependency-uses-canonical-contract-definitions$",
  "^(ts|tsx)\\.module\\.authority-call-flow-",
]

[profiles.language-authority]
enable = [
  "^refs\\.gherkin-takes-no-downstream-dependency$",
  "^refs\\.operation-takes-no-downstream-dependency$",
  "^refs\\.procedure-takes-no-downstream-dependency$",
  "^refs\\.only-runtime-takes-a-dependency-on-language-server$",
  "^refs\\.authority-dependency-never-reaches-ui$",
  "^refs\\.editor-dependency-on-authority-language-behavior-goes-through-language-server$",
  "^refs\\.ui-dependency-on-authority-language-behavior-is-forbidden$",
  "^ts\\.function\\.operation\\.operation-step-parser-call-flow-enters-gherkin$",
  "^ts\\.module\\.operation\\.operation-compiler-dependency-on-operation-step-grammar-is-explicit$",
  "^ts\\.function\\.procedure\\.procedure-step-parser-call-flow-enters-gherkin$",
  "^ts\\.module\\.procedure\\.procedure-compiler-dependency-on-procedure-step-grammar-is-explicit$",
  "^ts\\.function\\.language-server\\.language-server-step-completion-call-flow-enters-gherkin$",
  "^ts\\.module\\.language-server\\.language-server-dependency-on-operation-and-procedure-step-grammar-is-explicit$",
]

[[refs.where]]
id = "gherkin-takes-no-downstream-dependency"
severity = "error"
rationale = "Layering is gherkin ← operation ← procedure ← language-server ← runtime/ui. The shared Gherkin parser, tokenizer, locations, formatter and highlighter sit at the bottom and cannot depend on product languages or adapters."
expr = "$gherkin_source => NOT $gherkin_downstream_target"
message = "The Gherkin authority must remain independent from product languages and adapters."

[[refs.where]]
id = "authority-dependency-excludes-consumer-contract-relays"
severity = "error"
expr = "(kind = 'reexports' AND $authority_contract_target) => $authority_contract_facade"
message = "Import canonical contracts directly from their package; do not relay them through a consumer barrel."
rationale = "A contract has one discoverable owner. Canonical package entrypoints are sanctioned facades; consumer relay barrels create competing public access paths and hide that ownership during refactoring. Original direct reexport targets remain identifiable even under exported aliases. This rule does not ban unrelated exports or claim arbitrary transitive alias inference. See docs/architecture/rule-curation.md."

[[refs.where]]
id = "authority-dependency-uses-matcher-subpath"
severity = "error"
expr = "(kind = 'imports_symbol' AND $authority_matcher_target) => $authority_matcher_subpath"
message = "Import the exhaustive matcher from the package's /match entrypoint."
rationale = "The union and its exhaustive matcher form one consumption contract. The dedicated browser-safe matcher surface carries that behavior without loading compilation code. Matcher implementation modules use owner-relative imports; public contract types remain available from the package root. Importing a matcher is not by itself proof that every branch uses it."

[[refs.where]]
id = "operation-takes-no-downstream-dependency"
severity = "error"
rationale = "The Operation compiler and language descriptor are authoritative; downstream of them sit Procedure, the LSP adapter, the runtime and the UI, and depending on any of those would invert the authority."
expr = "$operation_source => NOT $operation_downstream_target"
message = "The Operation language authority crosses an outer boundary."

[[refs.where]]
id = "procedure-takes-no-downstream-dependency"
severity = "error"
rationale = "The Procedure compiler, expression compiler and evaluator may build on Gherkin and Operation, never on the LSP adapter, the runtime or the UI."
expr = "$procedure_source => NOT $procedure_downstream_target"
message = "The Procedure language authority crosses an outer boundary."

[[refs.where]]
id = "only-runtime-takes-a-dependency-on-language-server"
severity = "error"
rationale = "The runtime hosts the LSP WebSocket endpoint and is the adapter's only consumer; compilers and UI must not use the adapter as a language authority."
expr = "(NOT ($language_server_source OR $runtime_source)) => NOT $language_server_target"
message = "Only the language-server package and its runtime host may depend on the adapter implementation."

[[refs.where]]
id = "authority-dependency-never-reaches-ui"
severity = "error"
rationale = "Grammar, compilation and evaluation never depend on presentation code."
expr = "$authority_source => NOT $ui_target"
message = "A language authority depends on UI code."

[[refs.where]]
id = "extension-sdk-dependency-excludes-runtime-implementation"
severity = "error"
expr = "$extension_sdk_source => NOT ($runtime_target OR $ui_target OR $language_server_target)"
message = "The standalone extension contract must not import runtime, UI or LSP implementation."
rationale = "Public contracts are independent from their server implementation: extensions compile against the SDK without compiling or loading TRUST. Runtime and UI implement or consume those contracts, never the reverse. This dependency direction is a product architecture decision, not an exception for one extension."

[[ts.interface.where]]
id = "ui-dependency-uses-canonical-contract-definitions"
severity = "error"
expr = "moniker ~ '**/dir:packages/dir:trust-ui/**' => name !~ ^(OperationStep|CompiledOperation|CompiledProcedure|ProcedureCheck|ProcedureScenario|PlanView|PlanSummary|PlanCheck|CheckView|PlanEngagement|CheckAdmission|AttemptFinalization|PublishedProcedure|PlanEscalation|DescendantEscalation|TrialSummary|TrialEvent)$"
message = "Import or derive this contract from its canonical owner instead of declaring a UI interface copy."
rationale = "Contract ownership remains in the language packages and standalone SDK; presentation projections derive from those owners rather than redefining their meaning. The PostgreSQL preview crash exposed the cost of a divergent copy, but this rule protects the general ownership decision. Known names are guarded; renamed structural copies still require typechecks and review."

[[refs.where]]
id = "editor-dependency-on-authority-language-behavior-goes-through-language-server"
severity = "error"
rationale = "Completion, formatting, folding, semantic tokens and diagnostics reach the editor exclusively over the LSP protocol; the Monaco surface (gherkin-editor) and its client (lsp-client) neither execute authority behavior nor import the adapter implementation. Static presentation contracts such as the canonical highlighting token table may be shared directly. Template parameter scanning also stays behind the LSP boundary; the shared SDK context is transport data, not a browser parser. The editor drifted once into importing isExpressionIdentifierPart to compute replace ranges; ranges are now server-owned textEdits."
expr = "$editor_source => NOT ($authority_language_behavior_target OR $language_server_target)"
message = "The editor surface must obtain language behavior through the language server protocol, not by importing authority behavior or the adapter implementation."

[[refs.where]]
id = "ui-dependency-on-authority-language-behavior-is-forbidden"
severity = "error"
rationale = "Parsing, tokenizing and highlighting are language behavior owned by the authorities; the UI consumes them through the language server or the compiled models (plan-overlay hydrates from compiled locations since 2026-08-24). Single decided exemption: docs/highlight reuses the LSP's own highlight engine for static documentation pages — same engine, no duplication, and a live server cannot serve the standalone docs bundle."
expr = "($ui_source AND NOT $ui_docs_highlight_source) => NOT $authority_language_behavior_target"
message = "UI code invokes language behavior directly instead of consuming the language server or compiled models."

[[refs.where]]
id = "extension-host-dependency-excludes-coordination"
severity = "error"
expr = "$extension_host_source => NOT $coordination_target"
message = "The generic extension host must not statically depend on the coordination implementation."
rationale = "Extension hosting spans the runtime lifecycle, HTTP adapter and federated UI loader. Installed manifests select the implementation; the host must remain usable without coordination. This rule checks emitted static references only: computed child imports and federation remote loading require public runtime acceptance evidence."

[[refs.where]]
id = "coordination-dependency-excludes-runtime-and-ui-implementation"
severity = "error"
expr = "$coordination_source => NOT ($runtime_target OR $ui_target)"
message = "Coordination must use its supplied host capabilities, not import TRUST runtime or UI implementation."
rationale = "The coordination server and commands modules own the external PostgreSQL integration and its browser view consumes supplied URLs and language. Neither reaches TRUST database, qualification, container or UI internals. Coordination includes coordination-ui as a responsibility subset; build scripts and acceptance harnesses are outside this production boundary."

[[refs.where]]
id = "coordination-ui-dependency-excludes-server-implementation"
severity = "error"
expr = "$coordination_ui_source => NOT ($coordination_server_target OR $coordination_ui_server_api_target)"
message = "The coordination browser view must not import its server, PostgreSQL driver or Node APIs."
rationale = "The separately built federation remote reads through host-supplied endpoints. PostgreSQL connections and server credentials remain in the extension backend; static imports must not pull that implementation into the browser bundle. This boundary does not prove bundle contents or dynamic import targets."

[[refs.where]]
id = "runtime-dependency-excludes-dragon-heist"
severity = "error"
expr = "($runtime_source OR $extension_host_source) => NOT $dragon_heist_target"
message = "The generic runtime and extension host must not depend on Dragon Heist."
rationale = "Game rules and storage are extension-owned. Manifest loading connects the game without embedding a demonstration domain in TRUST."

[[refs.where]]
id = "dragon-heist-dependency-excludes-runtime-and-ui-implementation"
severity = "error"
expr = "$dragon_heist_source => NOT ($runtime_target OR $ui_target)"
message = "Dragon Heist uses public host capabilities rather than TRUST internals."
rationale = "External game results are not checklist qualification. The game cannot import TRUST storage, qualification or UI internals."

[[refs.where]]
id = "dragon-heist-ui-dependency-excludes-server-implementation"
severity = "error"
expr = "$dragon_heist_ui_source => NOT $dragon_heist_server_target"
message = "The game table must not import game storage or Node server APIs."
rationale = "Federated presentation consumes public game observations and authorized Plan views; persistent dice and move credentials remain server-side."

# AST construction guards, not inferred TypeScript exhaustiveness. The canonical
# handlers and tsc own exhaustiveness. These rules prevent known ad-hoc dispatch
# forms in the declared/import-discovered consumers. Ordinary value predicates
# remain allowed; variant predicates use their canonical matcher.
[[ts.module.where]]
id = "authority-call-flow-uses-canonical-dispatch"
severity = "error"
expr = '''$authority_dispatch_consumer => (none(ast, kind = 'switch_statement' OR (kind = 'member_expression' AND parent.kind = 'binary_expression' AND text =~ '\.(type|kind|format)$') OR (kind = 'subscript_expression' AND parent.kind = 'binary_expression' AND text =~ '\[("|\x27)(type|kind|format)("|\x27)\]$')) AND ($authority_role_source_consumer => none(ast, (kind = 'member_expression' AND parent.kind = 'binary_expression' AND text =~ '\.source$') OR (kind = 'subscript_expression' AND parent.kind = 'binary_expression' AND text =~ '\[("|\x27)source("|\x27)\]$'))))'''
message = "Use the canonical matcher instead of switching or comparing a variant discriminant in this consumer."
rationale = "In declared semantic consumers even variant predicates use the matcher, preventing early-return/final-fallback bypasses. Ordinary value guards and transport routers remain allowed. AST0.11 cannot infer receiver types or follow destructured/renamed discriminants."

[[tsx.module.where]]
id = "authority-call-flow-uses-canonical-dispatch"
severity = "error"
expr = '''$authority_dispatch_consumer => (none(ast, kind = 'switch_statement' OR (kind = 'member_expression' AND parent.kind = 'binary_expression' AND text =~ '\.(type|kind|format)$') OR (kind = 'subscript_expression' AND parent.kind = 'binary_expression' AND text =~ '\[("|\x27)(type|kind|format)("|\x27)\]$')) AND ($authority_role_source_consumer => none(ast, (kind = 'member_expression' AND parent.kind = 'binary_expression' AND text =~ '\.source$') OR (kind = 'subscript_expression' AND parent.kind = 'binary_expression' AND text =~ '\[("|\x27)source("|\x27)\]$'))))'''
message = "Use the canonical matcher instead of switching or comparing a variant discriminant in this consumer."
rationale = "TSX uses its own grammar namespace. This is the same bounded construction policy as TypeScript, not a global type-aware proof."

[[ts.module.where]]
id = "authority-call-flow-rejects-variant-assertions"
severity = "error"
expr = '''$authority_dispatch_consumer => none(ast, kind = 'as_expression' AND text =~ '\bas\s+(OperationStep|ShellStep|HttpStep|FileReadStep|PostgresqlStep|ShellArgument|HttpValueSource|HttpPathSegment|HttpBody|CompiledProcedureRole)\s*$')'''
message = "Consume the canonical union through its matcher instead of asserting a variant."
rationale = "Known variant-name assertions can hide a missing case. Boundary JSON validation and renamed structural copies are separate concerns; this rule does not claim to discover them."

[[tsx.module.where]]
id = "authority-call-flow-rejects-variant-assertions"
severity = "error"
expr = '''$authority_dispatch_consumer => none(ast, kind = 'as_expression' AND text =~ '\bas\s+(OperationStep|ShellStep|HttpStep|FileReadStep|PostgresqlStep|ShellArgument|HttpValueSource|HttpPathSegment|HttpBody|CompiledProcedureRole)\s*$')'''
message = "Consume the canonical union through its matcher instead of asserting a variant."
rationale = "Known variant-name assertions can hide a missing case. TSX is checked independently from TypeScript; TypeScript compilation remains the exhaustive-handler gate."

[[ts.module.where]]
id = "authority-call-flow-keeps-discriminants-in-matchers"
severity = "error"
expr = '''$authority_dispatch_consumer => none(ast, (kind = 'member_expression' AND parent.kind = 'variable_declarator' AND text =~ '\.(type|kind|format)$') OR (kind = 'object_pattern' AND text =~ '(^|[,{])\s*(type|kind|format)\s*[:,}]'))'''
message = "Pass the canonical value to its matcher instead of extracting a discriminant for local dispatch."
rationale = "Direct type/kind/format extraction and destructuring bypass comparison rules. Source is not banned here because UI source props are DSL text, not discriminants. Source aliases, computed keys and cross-module dataflow remain review gaps; renamed canonical imports and derived presentation types remain valid."

[[tsx.module.where]]
id = "authority-call-flow-keeps-discriminants-in-matchers"
severity = "error"
expr = '''$authority_dispatch_consumer => none(ast, (kind = 'member_expression' AND parent.kind = 'variable_declarator' AND text =~ '\.(type|kind|format)$') OR (kind = 'object_pattern' AND text =~ '(^|[,{])\s*(type|kind|format)\s*[:,}]'))'''
message = "Pass the canonical value to its matcher instead of extracting a discriminant for local dispatch."
rationale = "TSX applies the same direct-extraction convention as TypeScript; transport fields remain outside the declared semantic consumer scope."
