default_rules = false

[aliases]
gherkin_source = "source ~ '**/dir:packages/dir:trust-gherkin/**'"
operation_source = "source ~ '**/dir:packages/dir:trust-operation/**'"
procedure_source = "source ~ '**/dir:packages/dir:trust-procedure/**'"
authority_source = "$gherkin_source OR $operation_source OR $procedure_source"
gherkin_target = "target ~ '**/dir:packages/dir:trust-gherkin/**'"
operation_target = "target ~ '**/dir:packages/dir:trust-operation/**'"
procedure_target = "target ~ '**/dir:packages/dir:trust-procedure/**'"
lsp_source = "source ~ '**/dir:packages/dir:trust-language-server/**'"
lsp_target = "target ~ '**/dir:packages/dir:trust-language-server/**'"
runtime_target = "target ~ '**/dir:packages/dir:trust-runtime/**'"
ui_target = "target ~ '**/dir:packages/dir:trust-ui/**'"

[profiles.language-authority]
enable = [
  "^refs\\.gherkin-is-foundational$",
  "^refs\\.operation-owns-operation-language$",
  "^refs\\.procedure-owns-procedure-language$",
  "^refs\\.language-server-is-an-adapter$",
  "^refs\\.authorities-do-not-depend-on-ui$",
]

[[refs.where]]
id = "gherkin-is-foundational"
severity = "error"
rationale = "The shared Gherkin parser, tokenizer, locations, formatter and highlighter cannot depend on product languages or adapters."
expr = "$gherkin_source => NOT ($operation_target OR $procedure_target OR $lsp_target OR $runtime_target OR $ui_target)"
message = "The Gherkin authority must remain independent from product languages and adapters."

[[refs.where]]
id = "operation-owns-operation-language"
severity = "error"
rationale = "The Operation compiler and language descriptor are authoritative and cannot depend on Procedure, LSP, runtime or UI implementations."
expr = "$operation_source => NOT ($procedure_target OR $lsp_target OR $runtime_target OR $ui_target)"
message = "The Operation language authority crosses an outer boundary."

[[refs.where]]
id = "procedure-owns-procedure-language"
severity = "error"
rationale = "The Procedure compiler, expression compiler and evaluator are authoritative and cannot depend on LSP, runtime or UI implementations."
expr = "$procedure_source => NOT ($lsp_target OR $runtime_target OR $ui_target)"
message = "The Procedure language authority crosses an outer boundary."

[[refs.where]]
id = "language-server-is-an-adapter"
severity = "error"
rationale = "No compiler, runtime or UI implementation may import the LSP adapter as a language authority."
expr = "(NOT $lsp_source) => NOT $lsp_target"
message = "Only the language-server package may depend on its adapter implementation."

[[refs.where]]
id = "authorities-do-not-depend-on-ui"
severity = "error"
rationale = "Grammar, compilation and evaluation never depend on presentation code."
expr = "$authority_source => NOT $ui_target"
message = "A language authority depends on UI code."
