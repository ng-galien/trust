apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar
  namespace: trust-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsar
  template:
    metadata:
      labels:
        app: pulsar
    spec:
      containers:
        - name: pulsar
          image: apachepulsar/pulsar:3.3.2
          command: ["bin/pulsar", "standalone"]
          ports:
            - name: broker
              containerPort: 6650
            - name: http
              containerPort: 8080
          env:
            - name: PULSAR_MEM
              value: "-Xms256m -Xmx512m -XX:MaxDirectMemorySize=256m"
          readinessProbe:
            httpGet:
              path: /admin/v2/brokers/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: pulsar
  namespace: trust-test
spec:
  selector:
    app: pulsar
  ports:
    - name: broker
      port: 6650
      targetPort: 6650
    - name: http
      port: 8080
      targetPort: 8080
