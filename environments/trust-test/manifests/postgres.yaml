apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: trust-test
type: Opaque
stringData:
  POSTGRES_DB: flowlab
  POSTGRES_USER: flowlab
  POSTGRES_PASSWORD: flowlab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: trust-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-auth
          volumeMounts:
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d/001-coordination.sql
              subPath: 001-coordination.sql
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "flowlab"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: trust-test
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
