name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Runner acceptance tests commit in disposable repositories.
  GIT_AUTHOR_NAME: TRUST CI
  GIT_AUTHOR_EMAIL: ci@trust.invalid
  GIT_COMMITTER_NAME: TRUST CI
  GIT_COMMITTER_EMAIL: ci@trust.invalid

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        # The Corpus submodule is a private repository; the tests that read it skip without it.
        # The maintenance findings are checked against the base commit of each findings file: full history.
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
          cache: npm

      - name: Install system tools
        # Icarus Verilog checks the delegation topologies; PostgreSQL binaries serve the Runner credential test.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog postgresql
          ls /usr/lib/postgresql

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        # The workspace packages resolve each other through their built declarations, so the build comes first.
        run: npm run build

      - name: Package the Runner skill
        # The Dragon Heist and runtime tests run the packaged Runner scripts.
        run: npm run package:skill

      - name: Build the bundled example extension
        # The root build does not bundle extensions; the runtime and web acceptance tests install Dragon Heist.
        run: npm run build --workspace=@trust-extension/dragon-heist

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run check

      - name: Acceptance tests of the workspaces
        run: npm run test:acceptance

      - name: Acceptance tests of the repository scripts
        run: node --test --test-concurrency=1 scripts/*.acceptance.test.mjs

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/trust-web/test-results
            apps/trust-web/playwright-report
          if-no-files-found: ignore
